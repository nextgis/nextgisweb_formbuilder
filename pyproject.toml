[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "ANN", "RUF022"]
ignore = ["ANN002", "ANN003"]

[tool.ruff.lint.per-file-ignores]
"**/test/**.py" = ["ANN"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "nextgisweb-env-lib",
    "nextgisweb-comp",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"nextgisweb-env-lib" = ["nextgisweb.env", "nextgisweb.lib"]
"nextgisweb-comp" = ["nextgisweb"]
